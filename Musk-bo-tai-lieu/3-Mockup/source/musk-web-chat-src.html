<style>

:root{--g:#0E7C63;--gd:#095846;--gh:#095846;--gl:#E4F2EE;--ink:#1c1f1e;--mut:#667070;--line:#dde2e0;--bg:#f3f5f3;--card:#ffffff;--tint:#f6fbf9;--on:#ffffff;

:root[data-theme="dark"]{--g:#1a8f73;--gd:#8fe3cb;--gh:#157a62;--gl:#1c3a33;--ink:#e8ecea;--mut:#9aa6a2;--line:#2c3532;--bg:#121614;--card:#1b211f;--tint:#18221f;--warn:#3a2f14;--warnt:#f0c36d;--bad:#3d1f1c;--badt:#f5a39d;--ok:#5fd0b2;--info:#1d2a44;--infot:#a9c2f5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",-apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--g);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}

.main{flex:1;min-height:0;display:flex}

.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

@media(min-width:1040px){aside{display:block}}

.asm{margin-top:10px;font-size:13px;color:var(--mut)}.asm b{color:var(--ink);font-weight:500}
details{margin-top:10px}summary{cursor:pointer;color:var(--gd);font-weight:600;font-size:14px;list-style:none}summary::-webkit-details-marker{display:none}

.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cmp.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cc .why{font-size:13px;color:var(--ink);background:var(--tint);border-radius:8px;padding:8px 10px}

.cc{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:8px;min-width:0}

.ok{color:var(--ok)}.wn{color:var(--warnt)}.bd{color:var(--badt)}
.nb{margin-top:12px;font-size:13.5px}.nb ul{margin:4px 0 0;padding-left:18px;color:var(--mut)}.nb li{margin:2px 0}
.cart{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.cart img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.tot{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px}.tot .pr{margin:0}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.blk.v{background:var(--tint)}.blk.sale{background:var(--warn);color:var(--warnt);border-color:transparent}

.codes{display:grid;gap:8px;margin:8px 0}

.ckl{display:grid;gap:8px;margin:10px 0}
.ckl label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}.ckl input{margin-top:4px;width:16px;height:16px;accent-color:var(--g)}
.note{font-size:12.5px;color:var(--mut)}
.credits{font-size:11px;color:var(--mut);padding:14px 0 6px}.credits a{color:var(--mut)}
footer{background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fw{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.in{display:flex;gap:8px}.in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:10px 16px;font:inherit;outline:none;background:var(--card);color:var(--ink)}
.in input:focus{border-color:var(--g)}.in button{width:42px;border-radius:50%;border:0;background:var(--g);color:var(--on);font-size:18px;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.sugtag{white-space:nowrap}.opt b{flex-wrap:wrap}
@media(max-width:560px){.ln{grid-template-columns:48px 1fr}.ln img{width:48px;height:48px}.ln .p{grid-column:2}.ln.warn{grid-template-columns:1fr}.seg{order:3}body{font-size:14.5px}.m>.logo{display:none}.m{gap:0}.card{padding:14px}.status{min-width:0;width:100%;margin-left:0}.tag{white-space:normal}.u{max-width:92%}.bub{max-width:100%}.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%;text-align:center}.pr{font-size:24px}.tot .pr{font-size:24px}.rec img.pi{aspect-ratio:16/10}.pb .r{grid-template-columns:1fr auto}.pb .r .pill{grid-column:1/-1}.quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.quick .chip{flex:none}.code{flex-wrap:wrap}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}.seg button.on{background:var(--gl);color:var(--gd);font-weight:600}
.ln{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}.ln img{width:60px;height:60px;border-radius:8px;object-fit:cover}.ln b{font-size:14.5px}.ln .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.ln.warn{background:var(--warn);color:var(--warnt);border-radius:10px;padding:12px;border-bottom:0;margin:6px 0}.ln.warn b{color:var(--warnt)}.ln.warn .btn.o{color:var(--gd);background:var(--card)}
.sz{font-size:12.5px;color:var(--mut);margin-top:3px}
.bud{margin-top:12px}.bt{display:flex;justify-content:space-between;gap:10px;font-size:13px}.bbar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}.bbar i{display:block;height:100%;background:var(--g)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>

<header>
 <div class="logo">M</div>

 <div class="seg" role="group" aria-label="Chọn ngành hàng"><button data-cat="iphone" class="on">iPhone</button><button data-cat="baby">Đồ cho bé</button></div>
 <div class="status" aria-live="polite"><div class="t" id="stt">Bước 1/5 · <span>Hỏi nhu cầu</span></div><div class="bar" id="bar"><i class="on"></i><i></i><i></i><i></i><i></i></div></div>

 </aside>
</div>

<script>

 document.getElementById('ver').textContent=S.version?`Phiên bản đề xuất: v${S.version}`:'Chưa có đề xuất'}

/* ---------- Lượt hỏi (≤3 câu, có "Musk gợi ý", không hỏi lại điều đã có) ---------- */

   `<button class="chip sug ${pc==='any'?'sel':''}" data-q="color" data-v="any">Màu nào cũng được, lấy rẻ nhất</button>`;
  const srcOpts=[['vna','Mới, chính hãng VN/A','Bảo hành Apple tại VN. Musk gợi ý cho người mới.',1],['imp','Hàng nhập quốc tế','Rẻ hơn, bảo hành do shop.'],['like','Máy cũ like-new','Rẻ nhất, cần kiểm tra kỹ.']].map(([v,t,d,sg])=>
   `<button class="opt ${ps===v?'sel':''}" data-q="source" data-v="${v}"><b>${t}${sg?'<span class="sugtag">Musk gợi ý</span>':''}</b><span>${d}</span></button>`).join('')+

  const del=edit?`<div class="q"><h5>3 · Bạn cần nhận hàng khi nào?</h5><div class="chips"><button class="chip ${!S.fast?'sel':''}" data-q="fast" data-v="no">Không gấp</button><button class="chip ${S.fast?'sel':''}" data-q="fast" data-v="yes">Trong 2 ngày</button><button class="chip sug" data-q="fast" data-v="no">Chưa biết, Musk gợi ý giúp</button></div></div>`:'';
  return `<div class="card qc" data-edit="${edit?1:0}"><h4>${edit?'Sửa yêu cầu':'Musk cần 2 điều để chọn đúng máy'}</h4><div class="hint">${edit?'Chọn lại điều bạn muốn đổi. Musk tính lại và nói rõ cái gì thay đổi.':'iPhone 16 128GB, ngân sách tới 19 triệu. Chưa chắc thì chọn “Musk gợi ý”, mình sẽ giải thích.'}</div>
   <div class="q"><h5>1 · Bạn thích màu nào?</h5><div class="chips">${colorChips}</div><div class="note" style="margin-top:6px">Màu ảnh hưởng giá và tồn kho trên Shopee.</div></div>
   <div class="q"><h5>2 · Loại máy bạn muốn?</h5><div class="opts">${srcOpts}</div></div>${del}
   <div class="actions"><button class="btn go" disabled>${edit?'Cập nhật đề xuất':'Tiếp tục'}</button><button class="btn lnk skip">Bỏ qua, dùng mặc định</button></div></div>`}
function bindQuestions(el,edit){
  const card=el.querySelector('.qc'),go=card.querySelector('.go');
  const draft={color:S.color,source:S.source,fast:S.fast};
  const ready=()=>{go.disabled=!(draft.color&&draft.source)};
  card.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.q,v=b.dataset.v;card.querySelectorAll(`[data-q="${q}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    if(q==='color')draft.color=v; if(q==='source')draft.source=v; if(q==='fast')draft.fast=(v==='yes'); ready()});
  ready();
  const finish=(skip)=>{
    const prevC=S.color,prevS=S.source;
    let colorAuto=false,srcAuto=false;
    let c=draft.color,s=draft.source;
    if(!c){c='any';colorAuto=true} if(!s){s='auto';srcAuto=true}
    if(c==='any')colorAuto=true; if(s==='auto'){srcAuto=true;s='vna'}
    S.color=c;S.colorAuto=colorAuto;S.source=s;S.sourceAuto=srcAuto;S.fast=!!draft.fast;S.riskOK=(S.riskOK&&s===prevS)&&s!=='vna';
    card.classList.add('old');card.querySelectorAll('button').forEach(b=>b.disabled=true);
    user(skip?'Bỏ qua, dùng mặc định':`${c==='any'?'Màu nào cũng được':c} · ${s==='vna'&&srcAuto?'Chưa biết, Musk gợi ý':SRC[s]}${S.fast?' · nhận trong 2 ngày':''}`);
    afterAnswers(edit);
  };
  go.onclick=()=>finish(false);card.querySelector('.skip').onclick=()=>finish(true);
}

/* ---------- Decision (giả lập engine) ---------- */
function decide(){
  const src=srcOf();
  let shop,kind='BUY';
  if(src!=='vna'&&!S.riskOK){return {kind:'ASK',shop:SH.C,alt:SH.A}}
  if(src!=='vna')shop=SH.A; else if(S.balanced&&!S.fast&&!S.tie)return {kind:'TIE',shop:SH.C,final:SH.C.final,a:SH.C,b:SH.B}; else shop=S.fast?SH.B:(S.tie?SH[S.tie]:SH.C);
  const save=personalSaving(shop);
  return {kind,shop,final:shop.final-save,save}
}
function personalSaving(shop){if(!S.personal||shop.tier!=='Mall')return 0;return Math.min(Math.round(shop.list*.08),300000)}
function diffMsg(prev,next){
  if(!prev)return null;
  if(next.kind==='TIE')return 'Bạn ưu tiên cân bằng giá và tốc độ, nên Musk đưa ra hai lựa chọn ngang nhau để bạn quyết định.';
  if(prev.kind==='TIE'&&next.kind==='BUY')return `Bạn chọn ${next.shop.name} (${next.shop.id==='C'?'rẻ hơn, giao chậm hơn':'nhận sớm hơn, giá cao hơn'}). Giá cuối ${vnd(next.final)}.`;
  if(prev.kind==='ASK'&&next.kind==='BUY')return `Bạn đã chấp nhận rủi ro nên Musk xét thêm ${next.shop.name}: ${vnd(next.final)}.`;
  if(next.kind==='ASK')return `Bạn đổi loại máy sang "${SRC[srcOf()]}". Musk cần bạn xác nhận một rủi ro trước khi đề xuất.`;
  if(prev.kind==='ASK')return null;
  if(prev.shop.id!==next.shop.id){
    const d=next.final-prev.final,sg=d>=0?'+':'−';
    let why=prev.shop.id==='A'?`vì bạn quay lại máy mới VN/A (cần bảo hành Apple)${S.fast?' và nhận trong 2 ngày':''}`:S.fast?`vì bạn cần nhận trong 2 ngày (${prev.shop.name} giao ${prev.shop.eta})`:`vì bạn đổi sang ${SRC[srcOf()].toLowerCase()}`;
    return `Đổi từ ${prev.shop.name} sang ${next.shop.name} ${why}. Giá cuối ${sg}${k(Math.abs(d))}.`}
  if(next.save&&!prev.save)return `Vẫn là ${next.shop.name}; giá cuối giảm còn ${tr(next.final)} nhờ voucher của bạn.`;
  return `Vẫn là ${next.shop.name}; giá cuối ${vnd(next.final)}.`}

   <div class="c"><small>Giá cuối</small><span class="p">${tr(s.final)}</span><small>${s.id==='C'?'Rẻ nhất':'+350k'}</small></div>
   <div class="c"><small>Nhận hàng</small>${s.eta}</div><div class="c"><small>Bảo hành</small><span class="ok">✓ Apple 12 tháng, đã xác minh</span></div><div class="c"><small>Đánh giá</small>★ ${String(s.raw).replace('.',',')} → ${String(s.flt).replace('.',',')} · ${s.n}</div>
   <div class="why"><b>Chọn cái này nếu bạn</b> ${why}</div><button class="btn o" data-pick="${s.id}">Chọn ${s.name}</button></div>`;
  return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="dec ask">HỎI LẠI</span><span class="sub">Chọn 1 trong 2</span></div>
  <h4 style="margin:8px 0 4px;font-size:17px">Hai lựa chọn ngang nhau: rẻ hơn 350k hay nhận sớm hơn 2 ngày?</h4>
  <div class="sub">Cả hai đều là shop Mall có bảo hành Apple đã xác minh. Kết quả đổi theo việc bạn ưu tiên giá hay tốc độ, nên Musk chưa chọn thay bạn.</div>
  <div class="cmp two" style="margin-top:12px">${col(d.a,'muốn tiết kiệm 350k và chờ được 3–4 ngày.')}${col(d.b,'cần máy sớm hơn 2 ngày và chấp nhận trả thêm 350k.')}</div>
  <div class="note" style="margin-top:10px">Nút Duyệt chỉ hiện sau khi bạn chọn.</div></div>`}

/* ---------- HỎI LẠI: xác nhận rủi ro ---------- */
function askCard(d){return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="dec ask">HỎI LẠI</span><span class="sub">Cần bạn xác nhận một rủi ro</span></div>
  <h4 style="margin:8px 0 4px;font-size:17px">Có lựa chọn rẻ hơn 550k, nhưng không có bảo hành Apple.</h4>
  <div class="sub">Bạn chọn “${SRC[srcOf()]}”. Shop rẻ nhất là ${SH.A.name} (${tr(SH.A.final)}, shop thường).</div>
  <ul class="ck"><li class="bd">✕ Chỉ bảo hành shop 6 tháng, không phải bảo hành Apple.</li><li class="bd">✕ 9 người mua nói máy đã kích hoạt sẵn khi bán “mới”.</li><li class="y">✓ Phương án an toàn: ${SH.C.name} (Mall) ${tr(SH.C.final)}, bảo hành Apple đã xác minh.</li></ul>
  <div class="actions"><button class="btn" data-act="safe">Dùng phương án an toàn</button><button class="btn o" data-act="risk">Chấp nhận rủi ro, xem ${SH.A.name}</button></div></div>`}

/* ---------- Duyệt (trạng thái 4) ---------- */
function approveCard(d){
  const s=d.shop,colorName=S.color==='any'||!S.color?'Xanh lưu ly':S.color;
  const save=d.save||0,final=d.final;
  const coupon=save?`đã gồm voucher shop, voucher Mall và voucher của bạn (${S.personal.code}, hạn ${S.personal.exp})`:'đã gồm voucher shop, voucher Mall và phí ship';
  const voucher=S.personal?`<div class="blk v"><h6 class="okline">✓ Đã dùng voucher của bạn: ${S.personal.code}</h6><div class="small">Tiết kiệm thêm ${vnd(save)}. Nhớ chọn mã <b>${S.personal.code}</b> khi thanh toán trên Shopee. Ảnh gốc đã được xoá sau khi đọc.</div><div class="actions" style="margin-top:8px"><button class="btn lnk" data-act="delvoucher">Xoá voucher đã lưu</button></div></div>`:
   `<div class="blk v" id="vbox"><h6>Bạn có mã giảm giá riêng trên Shopee?</h6><div class="small" style="font-size:13.5px;color:var(--ink)">Musk chỉ thấy mã công khai. Mã bạn đã lưu trong Shopee (Tôi → Kho Voucher) có thể giúp rẻ hơn.</div>
    <div class="actions" style="margin-top:8px"><button class="btn o" data-act="vstart">Chụp Kho Voucher để Musk tính lại</button><button class="btn lnk" data-act="vskip">Bỏ qua</button></div>
    <div class="small" style="margin-top:6px">Musk không cần mật khẩu Shopee. Ảnh được xoá sau khi đọc.</div></div>`;
  const sale=(S.fast||SALE.days>SALE.dmax)?'':`<div class="blk sale"><b>11.11 còn 17 ngày.</b> Các năm trước, sản phẩm tương tự thường có thêm mã giảm vào ngày này, nhưng Musk không chắc giá sẽ thấp hơn. Musk chưa có dữ liệu giá để so sánh. Nếu không gấp, bạn có thể chờ xem.</div>`;
  return `<div class="card ac" data-v="${S.version}"><h4>Duyệt giỏ hàng</h4><div class="hint">Kiểm tra một lần rồi chốt. Musk không đặt hàng thay bạn, bạn thanh toán trên Shopee.</div>
   <div class="cart"><img src="${IMG.box}" alt="iPhone 16"><div><b>iPhone 16 128GB · ${colorName}</b><div class="sub">${s.name} (${s.tier}) · ${SRC[srcOf()]} · giao ${s.eta}</div></div></div>
   <div class="tot"><span class="pr">${vnd(final)}</span><span class="sub">giá cuối</span></div>
   <div class="sub">${coupon}.</div>
   <div class="note">Có thể rẻ hơn nếu dùng Xu hoặc ưu đãi thẻ — Musk chưa tính.</div>
   ${voucher}
   <div class="blk"><h6>Phụ kiện</h6>Hộp iPhone 16 chỉ có cáp USB-C, không có củ sạc. Bạn đã có củ sạc USB-C chưa? Nếu chưa, hãy mua riêng.
     <div class="small" style="margin-top:4px">AppleCare+ là gói bảo hành mở rộng mua riêng, Musk không tính vào giá.</div></div>
   ${sale}
   <div class="actions"><button class="btn" data-act="buy">Mua ngay</button><button class="btn o" data-act="remind">Nhắc tôi trước 11.11</button></div></div>`}

/* ---------- Thanh toán (5) & sau khi nhận ---------- */
function payCard(d){
  const s=d.shop;
  const vs=[`Voucher shop −${vnd(s.vs)} (đơn từ ${s.id==='B'?'18':'15'} tr)`].concat(s.vm?[`Voucher Mall −${vnd(s.vm)}`]:[]).concat(S.personal&&d.save?[`Voucher của bạn: mã ${S.personal.code} −${vnd(d.save)}`]:[]);
  return `<div class="card pay"><h4>Đặt hàng trên Shopee</h4><div class="hint">Mở sản phẩm, chọn đúng mã và kiểm tra trước khi bấm “Đặt hàng”.</div>
   <div class="cart"><img src="${IMG.box}" alt="iPhone 16"><div><b>iPhone 16 128GB · ${S.color==='any'||!S.color?'Xanh lưu ly':S.color}</b><div class="sub">${s.name} · ${vnd(d.final)}</div></div></div>
   <div class="blk"><h6>Mã cần chọn ở trang thanh toán</h6><ul style="margin:4px 0 0;padding-left:18px">${vs.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="blk"><h6>Kiểm tra trước khi bấm “Đặt hàng”</h6><div class="ckl"><label><input type="checkbox"> Đúng màu ${S.color==='any'||!S.color?'Xanh lưu ly':S.color} và dung lượng 128GB</label><label><input type="checkbox"> Giá ở trang thanh toán khớp ${vnd(d.final)}. Nếu chênh nhiều, quay lại hỏi Musk</label><label><input type="checkbox"> Đã chọn đủ các mã ở trên</label></div></div>
   <div class="actions"><button class="btn" data-act="shopee">Mở trên Shopee ↗</button><button class="btn o" data-act="placed">Đánh dấu đã đặt</button></div>
   <div class="note" style="margin-top:8px">Bạn thanh toán trên Shopee. Musk không giữ tiền hay mật khẩu. Giá thật là giá ở màn thanh toán Shopee.</div></div>`}
function afterCard(){return `<div class="card aft"><h4>Khi nhận máy, kiểm tra trước đã</h4><div class="hint">Chưa bấm “Đã nhận hàng” trên Shopee trước khi kiểm tra xong.</div>
  <div class="ckl"><label><input type="checkbox"> Quay video mở hộp, từ lúc còn nguyên seal</label><label><input type="checkbox"> Kiểm tra seal còn nguyên</label><label><input type="checkbox"> So IMEI trên hộp với IMEI trong Cài đặt (hoặc bấm *#06#)</label><label><input type="checkbox"> Kiểm tra bảo hành trên trang Apple</label></div>
  <div class="actions"><button class="btn" data-act="checked">Đã kiểm tra xong</button><button class="btn o" data-act="issue">Báo vấn đề</button></div></div>`}

/* ---------- Luồng ---------- */
async function afterAnswers(edit){
  mission();
  if(!edit&&(S.colorAuto||S.sourceAuto)){
    const parts=[];if(S.sourceAuto)parts.push('Musk chọn máy <b>mới, chính hãng VN/A</b> cho an toàn.');if(S.colorAuto)parts.push('Màu: Musk lấy màu <b>rẻ nhất còn hàng</b> (Xanh lưu ly).');
    await bot(`<div class="bub">${parts.join(' ')}<ul><li><b>VN/A</b> là máy phân phối chính hãng tại Việt Nam, bảo hành Apple.</li><li>Hộp chỉ có cáp, <b>không có củ sạc</b>.</li><li>Máy like-new rẻ hơn máy mới nhưng cần kiểm tra kỹ.</li></ul></div>`)}
  await propose(edit)}
async function propose(){
  const prev=S.cur;const d=decide();S.version+=1;S.cur=d;S.hist.push(d);mission();
  const dm=S.note||diffMsg(prev,d);S.note=null;
  if(S.lastProp)supersede(S.lastProp);
  if(d.kind==='TIE'){setStep(2,'Cần bạn chọn');if(dm)await bot(`<div class="diff">${dm}</div>`,300);S.lastProp=await bot(tieCard(d),520);S.lastProp.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{user('Chọn '+SH[b.dataset.pick].name);S.tie=b.dataset.pick;propose()});setQuick([]);return}
  if(d.kind==='ASK'){setStep(2,'Cần bạn xác nhận');if(dm)await bot(`<div class="diff">${dm}</div>`,300);S.lastProp=await bot(askCard(d));bindAsk(S.lastProp);setQuick([]);return}
  setStep(2,'Đề xuất');
  if(dm)await bot(`<div class="diff">${dm}</div>`,300);
  S.lastProp=await bot(proposalCard(d),520);bindProposal(S.lastProp,d);
  setQuick([['Cần nhận trong 2 ngày',()=>{S.fast=true;mission();propose()}],['Mình muốn cân bằng giá và tốc độ',()=>{S.balanced=true;S.tie=null;mission();propose()}],['Người mua chê gì?',why],['Rẻ hơn được không?',cheaper],['Mô phỏng: giá quan sát 3 ngày trước',()=>{S.stale=true;S.note='Giá của '+d.shop.name+' được quan sát cách đây 3 ngày. Musk cần cập nhật giá trước khi bạn duyệt.';propose()}]].filter(([t])=>!(S.fast&&t.startsWith('Cần nhận'))&&!(S.balanced&&t.startsWith('Mình muốn'))&&!(S.stale&&t.startsWith('Mô phỏng'))))}
function bindAsk(el){el.querySelector('[data-act="safe"]').onclick=()=>{user('Dùng phương án an toàn');S.source='vna';S.sourceAuto=true;S.riskOK=false;propose()};
  el.querySelector('[data-act="risk"]').onclick=()=>{user('Chấp nhận rủi ro, xem '+SH.A.name);S.riskOK=true;propose()}}
function bindProposal(el,d){
  const ap=el.querySelector('[data-act="approve"]');if(ap)ap.onclick=()=>{user('Duyệt giỏ này');approve()};
  const rf=el.querySelector('[data-act="refresh"]');if(rf)rf.onclick=async()=>{user('Cập nhật giá');await bot('<div class="bub">Đang lấy lại giá và voucher từ Shopee…</div>',900);S.stale=false;S.note=`Giá đã cập nhật lúc 09:30 hôm nay. ${d.shop.name} vẫn ${vnd(d.final)}, đã gồm voucher công khai đang chạy.`;propose()};
  el.querySelector('[data-act="compare"]').onclick=async()=>{user('So sánh 2 lựa chọn khác');setStep(2,'So sánh');const t=await bot(compareCard(d),520);bindCompare(t,d);setQuick([])};
  el.querySelector('[data-act="edit"]').onclick=async()=>{user('Sửa yêu cầu');const t=await bot(questionCard(true),400);bindQuestions(t,true);setQuick([])}}
function bindCompare(el,d){
  let pick=d.shop.id;
  el.querySelectorAll('.cc:not(.fade)').forEach(c=>c.onclick=()=>{pick=c.dataset.id;el.querySelectorAll('.cc').forEach(x=>x.classList.toggle('sel',x===c));el.querySelector('[data-act="pick"]').textContent='Chọn '+SH[pick].name});
  el.querySelector('[data-act="pick"]').onclick=()=>{
    user('Chọn '+SH[pick].name);
    if(pick!==d.shop.id){const prev=S.cur;const nd={kind:'BUY',shop:SH[pick],final:SH[pick].final-personalSaving(SH[pick]),save:personalSaving(SH[pick])};S.cur=nd;S.hist.push(nd);S.version+=1;mission();supersede(S.lastProp);
      bot(`<div class="diff">Đổi từ ${prev.shop.name} sang ${nd.shop.name} theo lựa chọn của bạn. Giá cuối ${nd.final-prev.final>=0?'+':'−'}${k(Math.abs(nd.final-prev.final))}${nd.shop.days>prev.shop.days?'':', nhận hàng sớm hơn'}.</div>`,300).then(()=>approve())}
    else approve()};
  el.querySelector('[data-act="back"]').onclick=()=>{user('Quay lại đề xuất');scrollEnd();setStep(2,'Đề xuất');bot('<div class="bub">Đây là đề xuất của Musk ở trên. Bấm “Duyệt giỏ này” khi bạn đã sẵn sàng.</div>',250)}}
async function approve(){
  setStep(3,'Duyệt');setQuick([]);const d=S.cur;
  S.lastApprove=await bot(approveCard(d),500);bindApprove(S.lastApprove,d)}
function bindApprove(el,d){
  const q=a=>el.querySelector(`[data-act="${a}"]`);
  q('buy').onclick=async()=>{user('Mua ngay');setStep(4,'Thanh toán');const t=await bot(payCard(d),450);bindPay(t,d);setQuick([])};
  q('remind').onclick=function(){this.textContent='✓ Sẽ nhắc trước 11.11';this.disabled=true;bot('<div class="bub">Musk lưu giỏ này và sẽ nhắc 1 ngày trước 11.11 cùng sáng ngày sale. Khi nhắc, Musk tính lại giá trước.</div>',300)};
  const vs=q('vstart'),sk=q('vskip'),dv=q('delvoucher');
  if(sk)sk.onclick=()=>{el.querySelector('#vbox').remove()};
  if(dv)dv.onclick=()=>{S.personal=null;user('Xoá voucher đã lưu');bot('<div class="bub">Đã xoá voucher đã lưu. Giá quay về giá công khai.</div>',250).then(()=>{S.version+=1;S.cur=decide();S.cur.kind='BUY';mission();supersede(el.closest('.m'));approve()})};
  if(vs)vs.onclick=()=>{
    const box=el.querySelector('#vbox');
    box.innerHTML=`<h6>Chụp Kho Voucher để Musk tính lại</h6><ol><li>Mở app Shopee → <b>Tôi</b> → <b>Kho Voucher</b>.</li><li>Chụp màn hình danh sách mã (có thể chụp 2–3 ảnh).</li><li>Tải ảnh lên đây.</li></ol>
     <div class="actions"><label class="btn o" for="vfile" style="display:inline-block">Tải ảnh lên</label><input type="file" id="vfile" accept="image/*" multiple hidden><button class="btn lnk" id="vsample">Dùng ảnh mẫu để xem thử</button></div>
     <div class="small">Musk không cần mật khẩu Shopee. Ảnh được xoá sau khi đọc. Tên, số điện thoại, số dư ví lọt vào ảnh sẽ bị bỏ qua.</div>`;
    const read=async()=>{box.innerHTML=`<h6>Musk đang đọc ảnh…</h6><span class="typing"><i></i><i></i><i></i></span>`;await wait(1100);
      box.innerHTML=`<h6>Musk đọc được 2 mã. Bạn xác nhận giúp trước khi tính lại</h6>
       <div class="codes"><label class="code"><input type="checkbox" class="cb" data-c="SHOPEE8" checked><span><b>SHOPEE8</b> · Voucher Mall<br>Giảm 8%, tối đa 300.000đ · đơn từ 10 triệu · hạn 31/10</span></label>
       <label class="code"><input type="checkbox" class="cb" data-c="HOANXU"><span><b>HOANXU</b> · Hoàn Xu<br><span class="wn">Musk đọc chưa chắc — kiểm tra lại.</span> Hoàn Xu không trừ vào giá cuối nên Musk không tính.</span></label></div>
       <div class="actions"><button class="btn o" id="vok">Xác nhận và tính lại</button><button class="btn lnk" id="vcancel">Hủy</button></div>
       <div class="small">Voucher có thể đã hết lượt dù còn hạn. Giá cuối thật là giá ở màn thanh toán Shopee.</div>`;
      box.querySelector('#vcancel').onclick=()=>{el.querySelector('#vbox').innerHTML='<h6>Bạn có mã giảm giá riêng trên Shopee?</h6><div class="small">Đã bỏ qua. Musk không nhắc lại trong phiên này.</div>'};
      box.querySelector('#vok').onclick=()=>{
        const on=[...box.querySelectorAll('.cb')].filter(x=>x.checked&&x.dataset.c==='SHOPEE8');
        if(!on.length){box.querySelector('.small').textContent='Chưa có mã nào Musk dùng được để tính lại. Chọn SHOPEE8 hoặc bấm Hủy.';return}
        S.personal={code:'SHOPEE8',exp:'31/10'};user('Xác nhận mã SHOPEE8');
        const prev=S.cur;const nd=decide();S.cur=nd;S.hist.push(nd);S.version+=1;mission();
        supersede(el.closest('.m'));
        bot(`<div class="diff">${diffMsg(prev,nd)} Dùng thêm mã của bạn: tiết kiệm thêm ${vnd(nd.save)}. Nhớ chọn mã <b>SHOPEE8</b> khi thanh toán trên Shopee.</div>`,300).then(()=>approve())}};
    box.querySelector('#vfile').onchange=read;box.querySelector('#vsample').onclick=read}}
function bindPay(el,d){
  el.querySelector('[data-act="shopee"]').onclick=function(){this.textContent='Bản mẫu: sẽ mở Shopee ↗'};
  el.querySelector('[data-act="placed"]').onclick=async()=>{user('Đánh dấu đã đặt');setStep(5,'Sau khi nhận');await bot('<div class="bub">Đã ghi nhận. Khi hàng về, mở lại Musk để kiểm tra trước khi bấm “Đã nhận hàng” trên Shopee.</div>',300);setQuick([['Mô phỏng: hàng đã giao',async()=>{const t=await bot(afterCard(),450);bindAfter(t);setQuick([])}]])}}
function bindAfter(el){
  el.querySelector('[data-act="checked"]').onclick=()=>{const all=[...el.querySelectorAll('input')].every(i=>i.checked);user('Đã kiểm tra xong');bot(all?'<div class="bub">Xong rồi. Bạn có thể bấm “Đã nhận hàng” trên Shopee. Cần mua thêm gì, nhắn cho Musk nhé.</div>':'<div class="bub">Bạn chưa tick hết mục kiểm tra. Nếu chưa kiểm tra seal và IMEI, hãy làm trước khi bấm “Đã nhận hàng” trên Shopee.</div>',300)};
  el.querySelector('[data-act="issue"]').onclick=()=>{user('Báo vấn đề');bot('<div class="bub">Giữ nguyên hộp, video mở hộp và ảnh IMEI. Đừng bấm “Đã nhận hàng” trên Shopee. Vào Shopee → Đơn mua → chọn Trả hàng/Hoàn tiền và gửi kèm video.</div>',300)}}

 <div class="quote ${s.quote.warn?'w':''}">${s.id==='A'?`“${s.quote.t}”<small>${s.quote.w}</small>`:'“Máy ổn nhưng giao 5 ngày, hộp ngoài hơi móp. Shop có xin lỗi và tặng ốp.”<small>h***an · ★3 · 14/10 · Shop đã trả lời</small>'}</div><div class="note" style="margin-top:6px">Shop trả lời 11/15 đánh giá thấp.</div></div>`)}

const OFF={tan:{L:{K:359000,L:349000},XL:{K:359000,L:349000}},sua:{GU:{Q:535000,K:549000},INF:{Q:569000}},khan:{K:89000,L:69000}};

const kgStr=()=>String(B.kg).replace('.',',');

function bbMilk(){if(B.milk==='drop')return 'drop';if(B.age<12)return B.milk==='INF'?'INF':'ask';if(B.qOut)return B.milk==='K'?'K':'unk';return 'GU'}
function bbPrice(kind,shop,size,ms){return kind==='tan'?OFF.tan[size][shop]:kind==='sua'?OFF.sua[ms==='INF'?'INF':'GU'][shop]:OFF.khan[shop]}
function bbTotal(pick,size,ms,personal){
  const o={};const add=(s,a)=>{o[s]=(o[s]||0)+a};
  add(pick.tan,bbPrice('tan',pick.tan,size)*B.qty);if(pick.sua)add(pick.sua,bbPrice('sua',pick.sua,size,ms));add(pick.khan,bbPrice('khan',pick.khan));
  let total=0;const det=Object.entries(o).map(([s,sub])=>{const vc=VOUCH[s];const vd=vc&&sub>=vc.min?vc.v:0;const ship=sub>=300000?0:15000;total+=sub-vd+ship;return {shop:s,sub,vd,ship,pv:0,net:sub-vd+ship}});
  let pv=0;if(personal){const b=det.filter(d=>d.sub>=700000).sort((a,c)=>c.sub-a.sub)[0];if(b){pv=30000;b.pv=30000;b.net-=30000;total-=30000}}
  return {total,det,pv,shops:det.length}}
function bbSolve(){
  const size=bbSize(),ms=bbMilk(),su=(ms==='GU'||ms==='INF')?'Q':ms==='K'?'K':null;let best=null;
  for(const t of ['K','L'])for(const kh of ['K','L']){const r=bbTotal({tan:t,khan:kh,sua:su},size,ms,B.personal);r.pick={tan:t,khan:kh,sua:su};if(!best||r.total<best.total||(r.total===best.total&&r.shops<best.shops))best=r}
  const g=bbTotal({tan:'L',khan:'L',sua:su},size,ms,B.personal);
  best.saving=Math.max(0,g.total-best.total);best.size=size;best.ms=ms;best.qty=B.qty;return best}
function bbDecide(){
  const r=bbSolve();
  if(r.ms==='ask'||r.ms==='unk')return {kind:'ASKMILK',r};
  if(r.total>B.budget){const q=B.qty;B.qty=q-1;const alt=bbSolve();B.qty=q;return {kind:'ASKBUDGET',r,alt,over:r.total-B.budget}}
  return {kind:'BUY',r}}

function bbBudgetCard(d){return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="dec ask">HỎI LẠI</span><span class="sub">Giỏ vượt ngân sách tháng</span></div>

function bbDiff(prev,d){if(!prev)return null;const a=prev.r,b=d.r,out=[];

  if(a.qty!==b.qty)out.push(`Số bịch tã ${a.qty} → ${b.qty}.`);
  if(a.ms!==b.ms){if(b.ms==='unk')out.push(`${BS.Q.name} hết hàng và ${BS.K.name} không ghi hạn sữa, nên Musk chưa chốt món sữa.`);else if(b.ms==='K')out.push(`Bạn chọn mua sữa của ${BS.K.name} và tự kiểm tra hạn khi nhận.`);else if(b.ms==='ask')out.push(`Bé ${B.age} tháng chưa hợp Meiji Growing Up (12–36 tháng), nên Musk chưa chốt món sữa.`);else if(b.ms==='INF')out.push('Đã chuyển sang Meiji Infant 0–12 tháng theo lựa chọn của bạn.');else if(b.ms==='drop')out.push('Đã bỏ sữa khỏi giỏ.');else out.push('Sữa quay lại Meiji Growing Up.')}
  if(prev.kind==='ASKBUDGET'&&d.kind==='BUY'&&!out.length)out.push('Giỏ đã trong ngân sách tháng.');
  if(a.total!==b.total)out.push(`Tổng giỏ ${vnd(a.total)} → ${vnd(b.total)}.`);else if(out.length)out.push(`Giá cuối vẫn ${vnd(b.total)}.`);
  return out.length?out.slice(0,2).join(' '):null}
async function bbPropose(){

function bbPayCard(d){const r=d.r;
  const orders=r.det.map((o,i)=>{const items=[];if(r.pick.tan===o.shop)items.push(`Tã quần Bobby ${r.size}${PACK[r.size]} × ${r.qty}`);if(r.pick.sua===o.shop)items.push(`Sữa Meiji ${r.ms==='INF'?'Infant':'Growing Up'} 800g × 1`);if(r.pick.khan===o.shop)items.push('Khăn ướt không mùi 100 tờ × 1');
    const checks=[];if(r.pick.tan===o.shop)checks.push(`Đúng size ${r.size}${PACK[r.size]}, dạng tã quần`);if(r.pick.sua===o.shop)checks.push('Đúng Meiji '+(r.ms==='INF'?'Infant':'Growing Up')+' 800g, bản bán tại Việt Nam'+(r.ms==='K'?'. Shop không ghi hạn: kiểm tra hạn dưới đáy hộp khi nhận, cần từ 6 tháng':''));if(r.pick.khan===o.shop)checks.push('Đúng khăn ướt không mùi 100 tờ');
    const codes=[o.vd?`Voucher shop −${vnd(o.vd)} (đơn từ ${k(VOUCH[o.shop].min)})`:null,o.pv?`Voucher của bạn: mã ${B.personal.code} −${vnd(o.pv)}`:null].filter(Boolean);
    return `<div class="blk" data-o="${i}"><div style="display:flex;gap:8px;align-items:center"><b>Đơn ${i+1} · ${BS[o.shop].name}</b><span class="pill n st">Chưa đặt</span><span style="margin-left:auto;font-weight:700">${vnd(o.net)}</span></div>
     <ul style="margin:6px 0;padding-left:18px">${items.map(x=>`<li>${x}</li>`).join('')}</ul>${codes.length?`<div class="small"><b>Mã cần chọn:</b> ${codes.join(' · ')}</div>`:'<div class="small">Không có mã cần chọn cho đơn này.</div>'}
     <div class="ckl">${checks.map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}<label><input type="checkbox"> Giá ở trang thanh toán khớp ${vnd(o.net)}. Nếu chênh nhiều, quay lại hỏi Musk</label></div></div>`}).join('');
  return `<div class="card pay"><h4>Đặt hàng trên Shopee</h4><div class="hint">Giỏ mở thành ${r.det.length} đơn vì mua ở ${r.det.length} shop. Đặt lần lượt từng đơn, chọn đúng mã và kiểm tra trước khi bấm “Đặt hàng”.</div>${B.stale?'<div class="blk sale" style="margin:0 0 10px">Giá Musk quan sát đã cũ (22/10). Giá trên Shopee có thể khác, hãy kiểm tra giá cuối ở trang thanh toán.</div>':''}${orders}
  <div class="actions"><button class="btn" data-act="open">Mở đơn 1 trên Shopee ↗</button><button class="btn o" data-act="placed">Đánh dấu đơn 1 đã đặt</button></div><div class="note" style="margin-top:8px">Bạn thanh toán trên Shopee. Musk không giữ tiền hay mật khẩu. Giá thật là giá ở màn thanh toán Shopee.</div></div>`}
function bbBindPay(el,d){const n=d.r.det.length,cur=()=>B.placed.findIndex(x=>!x);
  const op=el.querySelector('[data-act="open"]'),pl=el.querySelector('[data-act="placed"]');
  op.onclick=()=>{op.textContent='Bản mẫu: sẽ mở Shopee ↗'};
  pl.onclick=async()=>{const i=cur();B.placed[i]=true;const blk=el.querySelector(`[data-o="${i}"]`);const st=blk.querySelector('.st');st.className='pill g st';st.textContent='Đã đặt';
    const j=cur();
    if(j===-1){op.disabled=pl.disabled=true;user('Đánh dấu đơn '+(i+1)+' đã đặt');setStep(5,'Sau khi nhận');await bot('<div class="bub">Đã ghi nhận cả '+n+' đơn. Khi hàng về, mở lại Musk để kiểm tra trước khi bấm “Đã nhận hàng” trên Shopee.</div>',300);setQuick([['Mô phỏng: hàng đã giao',async()=>{const t=await bot(bbAfterCard(d),450);bbBindAfter(t);setQuick([])}]])}
    else{op.textContent=`Mở đơn ${j+1} trên Shopee ↗`;pl.textContent=`Đánh dấu đơn ${j+1} đã đặt`}}}
function bbAfterCard(d){const r=d.r;return `<div class="card aft"><h4>Khi nhận hàng, kiểm tra trước đã</h4><div class="hint">Chưa bấm “Đã nhận hàng” trên Shopee trước khi kiểm tra xong.</div>
  <div class="ckl"><label><input type="checkbox"> Tã: kiểm tra bao bì, ngày sản xuất và mã lô</label><label><input type="checkbox"> Sữa: kiểm tra hạn, tem niêm phong, lon không móp</label><label><input type="checkbox"> Khăn ướt: kiểm tra seal từng gói</label></div>
  <div class="blk"><b>Lịch mua lại.</b> ${r.qty} bịch tã dùng khoảng ${Math.round(r.qty*PACK[r.size]/6)}–${Math.round(r.qty*PACK[r.size]/5)} ngày và 1 hộp sữa khoảng 10–14 ngày. Musk sẽ nhắc bạn mua sữa lại sau khoảng 10 ngày.</div>
  <div class="actions"><button class="btn" data-act="checked">Đã kiểm tra xong</button><button class="btn o" data-act="issue">Báo vấn đề</button></div></div>`}
function bbBindAfter(el){
  el.querySelector('[data-act="checked"]').onclick=()=>{const all=[...el.querySelectorAll('input')].every(i=>i.checked);user('Đã kiểm tra xong');bot(all?'<div class="bub">Xong rồi. Bạn có thể bấm “Đã nhận hàng” trên Shopee. Musk sẽ nhắc mua lại khi gần hết.</div>':'<div class="bub">Bạn chưa tick hết mục kiểm tra. Hãy kiểm tra hạn sữa, seal và mã lô trước khi bấm “Đã nhận hàng” trên Shopee.</div>',300)};
  el.querySelector('[data-act="issue"]').onclick=()=>{user('Báo vấn đề');bot('<div class="bub">Giữ nguyên hộp, ảnh hạn dùng/mã lô và video mở hộp. Đừng bấm “Đã nhận hàng” trên Shopee. Vào Shopee → Đơn mua → chọn Trả hàng/Hoàn tiền và gửi kèm ảnh.</div>',300)}}

/* ---------- khởi động ---------- */
async function startBaby(){
  CAT='baby';missionBaby();setStep(1,'Hỏi nhu cầu');
  user('Tã quần Bobby 2 bịch, sữa Meiji 1 hộp, khăn ướt.');
  const t=await bot(bbIntro(),600);bbBindQ(t);
  col.append($e(`<div class="credits">Ảnh minh họa từ Wikimedia Commons: <a href="https://commons.wikimedia.org/wiki/File:Diapers_for_babies_and_toddlers,_Albert_Heijn_Winschoten_(2018)_01.jpg" target="_blank" rel="noopener">Donald Trung Quoc Don</a> (CC BY-SA 4.0), <a href="https://commons.wikimedia.org/wiki/File:Infant_formula.jpg" target="_blank" rel="noopener">국립국어원</a> (CC BY-SA 2.0 KR), <a href="https://commons.wikimedia.org/wiki/File:Baby_wipes.jpg" target="_blank" rel="noopener">Headlock0225</a> (CC BY 4.0). Ảnh được thu nhỏ. Tên shop, giá, đánh giá là dữ liệu giả lập.</div>`));
  const h=location.hash.slice(1);if(h.startsWith('baby')&&h!=='baby-manual'){const c=sel=>document.querySelector(sel),wt=ms=>new Promise(r=>setTimeout(r,ms));await wt(300);
    c('[data-r="no"]').click();c('.qc .go').click();await wt(2200);
    const chip=t=>[...document.querySelectorAll('#quick .chip')].find(b=>b.textContent.includes(t)).click();
    if(h==='baby-xl'){chip('12,5 kg');await wt(2600)}
    if(h==='baby-milk'){chip('9 tháng');await wt(2600)}
    if(h==='baby-budget'){chip('Thêm 1 bịch');await wt(2600)}
    if(h==='baby-stale'){chip('3 ngày trước');await wt(2600)}
    if(h==='baby-oos'){chip('Sữa Ngon hết hàng');await wt(2600)}
    if(h==='baby-oosK'){chip('Sữa Ngon hết hàng');await wt(2600);c('.bc:not(.old) [data-act="acceptK"]').click();await wt(2600)}
    if(h==='baby-buy'||h==='baby-pay'||h==='baby-v'){c('.bc [data-act="approve"]').click();await wt(1200)}
    if(h==='baby-v'){c('[data-act="vstart"]').click();await wt(200);document.getElementById('bsample').click();await wt(1500);document.getElementById('bok').click();await wt(2200)}
    if(h==='baby-pay'){c('.ac:not(.old) [data-act="buy"]').click();await wt(1200)}
    await wt(200);feed.scrollTop=feed.scrollHeight;if(h==='baby-stale'||h==='baby-oos'){const bc=[...document.querySelectorAll('.bc:not(.old)')].pop();feed.scrollTop+=bc.getBoundingClientRect().top-feed.getBoundingClientRect().top-12}}}
function switchCat(cat){
  col.innerHTML='';quick.innerHTML='';Object.keys(S).forEach(k2=>delete S[k2]);Object.assign(S,JSON.parse(S0));B=JSON.parse(B0);CAT=cat;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));
  setStep(1,'Hỏi nhu cầu');
  if(cat==='baby')startBaby();else{CAT='iphone';startIphone()}}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{if(b.dataset.cat!==CAT)switchCat(b.dataset.cat)});

if(location.hash.slice(1).startsWith('baby')){document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.cat==='baby'));startBaby()}else startIphone();
</script>
